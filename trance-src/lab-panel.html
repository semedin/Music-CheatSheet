<div id="referenceFamily" class="reference-family"></div>
<div class="development-panel">
 <div class="development-heading"><div><span class="eyebrow red">MELODIC DEVELOPMENT / GOD MODE</span><h4>Give the melody somewhere to go.</h4></div><span class="tiny" id="answerSeed">ANSWER 01</span></div>
 <p id="developmentHint" class="hint"></p>
 <fieldset id="developmentControls"><legend class="sr-only">Develop the selected source melody</legend>
 <div class="development-fields"><label>PHRASE LENGTH<select id="phraseLength"><option value="8">8 bars / clear hook</option><option value="16">16 bars / full journey</option></select></label><label>MELODIC SHAPE<select id="arcSelect"><option value="arch">Rise, peak, return</option><option value="ascent">Climb toward release</option><option value="valley">Fall, then lift</option></select></label><label>PITCH MOVEMENT<select id="movement"><option value="4">Close / singable</option><option value="7">Expressive</option><option value="10">Wide / dramatic</option></select></label><label>RHYTHM<select id="densitySelect"><option value="source">Follow the reference</option><option value="flow">Flowing eighths</option><option value="drive">Driving sixteenths</option></select></label></div>
 <div class="development-actions"><button id="newAnswer" class="btn primary small">↗ Write a new answer</button><button id="undoAnswer" class="btn secondary small">Undo</button><button id="resetDevelopment" class="text-btn">Reset development</button><span class="tiny">OPENING MOTIF PROTECTED</span></div>
 </fieldset>
</div>
<div id="melodyMetrics" class="melody-metrics"></div>
<div class="phrase-overview" id="phraseOverview" aria-label="Pitch movement across the full phrase"></div>
<p id="phraseExplanation" class="hint"></p>
<div class="listening-tools"><label>LISTEN TO<select id="listenMode"><option value="full">Full arrangement</option><option value="upper">Upper melody only</option><option value="chordTop">Chord top line only</option></select></label><label>PIANO ROLL VIEW<select id="rollZoom"><option value="4">4 bars in detail</option><option value="8">8 bars</option><option value="all">Complete phrase</option></select></label><div class="bar-navigation"><button class="icon-btn" id="prevBars" aria-label="Previous bars">←</button><button class="icon-btn" id="nextBars" aria-label="Next bars">→</button><button id="loopWindow" class="btn secondary small" aria-pressed="false">↻ Loop view</button></div></div>
